<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORIGENS — Testes Alpha 0.1</title>
<style>body{font:15px system-ui;background:#071c25;color:#d9f5ee;padding:28px;max-width:850px;margin:auto}li{padding:8px;border-bottom:1px solid #24444b}.ok{color:#8df5d1}.fail{color:#ff9d91}code{color:#b5e7d9}</style></head>
<body><h1>ORIGENS · Testes de integração</h1><p>Testes locais de navegador para Engine, SeedCore e persistência.</p><ol id="results"></ol><script src="engine.js"></script><script src="seed-core.js"></script><script src="life.js"></script><script src="mind.js"></script><script src="genetic-core.js"></script><script>
const results=document.querySelector('#results');let passed=0,failed=0;
function test(name,fn){const li=document.createElement('li');try{fn();li.className='ok';li.textContent='✓ '+name;passed++;}catch(e){li.className='fail';li.textContent='✗ '+name+' — '+e.message;failed++;}results.append(li)}
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
test('SeededRandom reproduz a mesma sequência',()=>{const a=new SeedCore.SeededRandom(42),b=new SeedCore.SeededRandom(42);if(!eq([a.next(),a.next(),a.next()],[b.next(),b.next(),b.next()]))throw Error('sequências divergentes')});
test('EventBus publica e remove assinaturas',()=>{const bus=new SeedCore.EventBus();let n=0;const off=bus.on('x',()=>n++);bus.emit('x');off();bus.emit('x');if(n!==1)throw Error('contagem '+n)});
test('Clocks avançam conforme escalas',()=>{const c=new SeedCore.Clocks();c.biologicalScale=2;c.geologicalScale=3;c.tick(4);if(c.real!==4||c.biological!==8||c.geological!==12)throw Error('relógios inconsistentes')});
test('DeltaSave restaura seed, entidades e eventos',()=>{const d=new SeedCore.DeltaSave(77);d.set('organism',{energy:61});d.event('FoodConsumed');const r=SeedCore.DeltaSave.restore(d.snapshot());if(r.seed!==77||r.delta.entities.organism.energy!==61||r.delta.events.length!==1)throw Error('snapshot divergente')});
test('WorldManager conecta relógio, evento e delta',()=>{const w=new SeedCore.WorldManager(9);let seen=0;w.events.on('WorldTick',()=>seen++);w.tick(2);w.commit('lab','mutacao',{gene:'cilios'});if(seen!==1||w.clocks.real!==2||!w.save.delta.entities['progress.lab'])throw Error('integração incompleta')});
test('Evolution gera DNA determinístico por seed',()=>{Evolution.setSeed(123);const a=Evolution.makeSpecies({habitat:'oceano'},0);Evolution.setSeed(123);const b=Evolution.makeSpecies({habitat:'oceano'},0);if(a.name!==b.name||a.population!==b.population||!eq(a.dna,b.dna))throw Error('evolução não reproduzível')});
test('Life.world reproduz a população inicial por seed',()=>{const a=Life.world(314);const b=Life.world(314);if(a.species[0].name!==b.species[0].name||a.species[0].members[0].g.legs!==b.species[0].members[0].g.legs)throw Error('mundo biológico divergente')});
test('Mind.world reproduz agentes por seed',()=>{const a=Mind.world(271);const b=Mind.world(271);if(a.agents[0].name!==b.agents[0].name||a.agents[0].x!==b.agents[0].x)throw Error('mundo mental divergente')});
test('App Hub mantém estado global e histórico de ações',()=>{ORIGENSApp.reset();ORIGENSApp.setState('laboratorio');ORIGENSApp.recordAction('laboratorio','teste',{value:1});const s=ORIGENSApp.getState();if(s.activeModule!=='laboratorio'||s.visits.laboratorio!==1||s.actions[0].action!=='teste')throw Error('estado global inconsistente')});
test('GeneticCore cria identidade e fenótipo a partir da Anatomia',()=>{const g=GeneticCore.fromAnatomy({skeleton:'Ósseo',respiration:'Pulmões',legs:4,muscle:3,brain:'Curioso'},99);if(!g.id||g.phenotype.limbCount!==4||g.phenotype.locomotion!=='andar'||g.phenotype.habitatAffinity!=='terrestre')throw Error('fenótipo não corresponde à anatomia')});
test('Herança preserva ancestralidade e é determinística por seed',()=>{const p=GeneticCore.create({genes:{skeleton:'Exoesqueleto',legs:4,brain:'Estratégico'}},{id:'pai',generation:2});const a=GeneticCore.reproduce(p,p,123),b=GeneticCore.reproduce(p,p,123);if(a.organism.generation!==3||a.organism.parentIds[0]!=='pai'||!eq(a.organism.genes,b.organism.genes)||!eq(a.mutation,b.mutation))throw Error('herança divergente')});
test('DNA da Anatomia altera atributos no Laboratório',()=>{const g=GeneticCore.create({genes:{skeleton:'Exoesqueleto',legs:6,muscle:4,brain:'Estratégico'}},{id:'teste-anatomia'});const s=Evolution.makeSpecies({habitat:'planície'},0);GeneticCore.applyToSpecies(g,s);if(s.geneticIdentity!=='teste-anatomia'||s.dna.body.limbs!==6||s.dna.defense.armor<.7||s.dna.intelligence.learning<.89)throw Error('DNA não aplicado ao fenótipo')});
const summary=document.createElement('p');summary.innerHTML='<strong>'+passed+' aprovados · '+failed+' falharam</strong>';results.after(summary);
</script></body></html>
